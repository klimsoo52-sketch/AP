// 토스식 단위 버튼: 데이터는 항상 원데이터 그대로. 버튼은 "한 화면에 보이는 시간 범위(일)"만 조절한다.
// 10분=1일, 1시간=3일, 3시간=7일, 일=30일 (데이터가 더 짧으면 전체가 한 화면에 꽉 참)
const SPAN={10:1,60:3,180:7,1440:30};
let unit=10;
// lo~hi 안에서 h시간마다의 정각 시각(ms) 목록 (0시 기준 정렬)
function hourMarks(lo,hi,h){
 const d=new Date(lo);d.setMinutes(0,0,0);if(d.getTime()<lo)d.setHours(d.getHours()+1);
 while(d.getHours()%h)d.setHours(d.getHours()+1);
 const r=[];for(;d.getTime()<=hi;d.setHours(d.getHours()+h))r.push(d.getTime());return r;
}
function syncSeg(){document.querySelectorAll("#seg button").forEach(b=>{b.classList.toggle("on",+b.dataset.u===unit);b.disabled=!F.time})}
document.querySelectorAll("#seg button").forEach(b=>b.onclick=()=>{unit=+b.dataset.u;syncSeg();draw()});
// x축: 날짜(요일)만 표시. 라벨은 각 날짜 구간의 가운데에 둔다. 예) 26.11.04(수)
const fmtDay=ms=>{const d=new Date(ms);return pad(d.getFullYear()%100)+"."+pad(d.getMonth()+1)+"."+pad(d.getDate())+"("+"일월화수목금토"[d.getDay()]+")"};
// 날짜 글자 크기: 하루 폭에 맞춰 11~24px (글자 폭 ≈ 크기×6.7)
const dateFont=pxDay=>Math.max(11,Math.min(24,Math.floor(pxDay*0.92/6.7)));
function dayTicks(lo,hi,pxDay){
 const t=[],k=Math.max(1,Math.ceil((dateFont(pxDay)*6.7+10)/pxDay));   // 최소 크기로도 겹치면 k일마다 하나씩만 표시
 let d=new Date(lo),i=0;d.setHours(0,0,0,0);
 while(d.getTime()<=hi){
  const nd=new Date(d);nd.setDate(nd.getDate()+1);
  const a=Math.max(d.getTime(),lo),b=Math.min(nd.getTime(),hi);
  if(b>a&&i%k===0)t.push({value:(a+b)/2});
  if(b>a)i++;d=nd;
 }
 return t.length?t:[{value:lo}];
}
function draw(){
 const ks=Object.keys(F.series);let lo=sel[0],hi=sel[1];
 const ds=[],cols={};
 ks.forEach((k,i)=>{
  cols[k]=PAL[i%8];
  const pts=F.series[k].filter(p=>p[0]>=lo&&p[0]<=hi);
  if(active.has(k))ds.push({label:k,borderColor:cols[k],backgroundColor:cols[k],borderWidth:1.6,pointRadius:0,tension:.15,data:pts.map(p=>({x:p[0],y:p[1]}))});
 });
 // 그래프 폭: 한 화면에 SPAN[unit]일이 보이도록 정함(화면보다 넓으면 좌우 스크롤), 세로축은 왼쪽에 고정
 const cvs=$("cvs");
 const n=Math.max(1,...ds.map(d=>d.data.length)),span=Math.max((hi-lo)/86400000,1e-6);
 const w=Math.max(cvs.clientWidth,F.time?span*cvs.clientWidth/SPAN[unit]:n*6);
 const pxDay=w/span;   // 하루가 차지하는 폭(px)
 $("cvi").style.width=w+"px";
 // y축 표시 범위: 하한 25°C 고정(그 아래 값은 안 보임), 상한은 기본 45°C. 표시 중인 값이 상한에 닿거나 넘으면 5°C 단위로 늘림(예: 55°C -> 60°C)
 const ys=ds.flatMap(d=>d.data.map(p=>p.y));
 const yMin=25,yMax=Math.max(45,Math.ceil((Math.max(...ys)+1e-4)/5)*5);
 const fixX=s=>{s.height=58};   // 시간(작은 글자) 줄 + 날짜(24px) 줄
 const base={responsive:true,maintainAspectRatio:false,animation:false};
 if(chart)chart.destroy();if(chartY)chartY.destroy();
 chart=new Chart($("c"),{type:"line",data:{datasets:ds},options:{...base,
  layout:{padding:{top:12,right:12,bottom:0,left:0}},
  interaction:{mode:"nearest",axis:"x",intersect:false},
  scales:{x:{type:"linear",min:lo,max:hi,grid:{display:!F.time},
    ticks:F.time?{autoSkip:false,maxRotation:0,callback:v=>fmtDay(v),padding:20,font:{size:dateFont(pxDay),weight:"600"},
     color:c=>c.tick&&new Date(c.tick.value).getDay()===0?(getComputedStyle(document.documentElement).getPropertyValue("--bad").trim()||"#d92d20"):Chart.defaults.color}:{maxTicksLimit:8},
    afterBuildTicks:F.time?s=>{s.ticks=dayTicks(lo,hi,pxDay)}:undefined,afterFit:fixX},
   y:{min:yMin,max:yMax,ticks:{display:false,stepSize:5,maxTicksLimit:100,autoSkip:false},border:{display:false,dash:[2,4]},   // 5°C마다 가는 점선 기준선(v4: 점선은 border.dash)
    grid:{color:getComputedStyle(document.body).color.replace("rgb(","rgba(").replace(")",",.28)"),lineWidth:1},afterFit:s=>{s.width=0}}},
  plugins:{legend:{display:false},tooltip:{callbacks:{title:i=>fmtT(F,i[0].parsed.x),label:c=>c.dataset.label+": "+c.parsed.y.toFixed(1)+" °C"}}}},
  plugins:[{id:"hv2h",beforeDatasetsDraw(c){   // 2시간마다 세로 점선 (0시 선은 더 진하게)
   if(!F.time)return;const{ctx,chartArea:a,scales:{x}}=c;
   ctx.save();
   // 일요일(휴일) 구간: 옅은 적색 배경
   let dd=new Date(lo);dd.setHours(0,0,0,0);
   while(dd.getTime()<=hi){const nd=new Date(dd);nd.setDate(nd.getDate()+1);
    if(dd.getDay()===0){const l=Math.max(dd.getTime(),lo),r=Math.min(nd.getTime(),hi);
     if(r>l){ctx.fillStyle="rgba(239,68,68,.13)";const x1=x.getPixelForValue(l);ctx.fillRect(x1,a.top,x.getPixelForValue(r)-x1,a.bottom-a.top)}}
    dd=nd}
   // 시간 점선: 기본 2시간마다, 화면이 넓어져 촘촘하면 4·6·12·24시간 간격으로. 0시(날짜 구분)는 실선으로 강조
   ctx.strokeStyle=getComputedStyle(document.body).color;
   const sh=[2,4,6,12,24].find(h=>pxDay*h/24>=8)||24;
   hourMarks(lo,hi,sh).forEach(t=>{const px=x.getPixelForValue(t),mid=new Date(t).getHours()===0;
    ctx.setLineDash(mid?[]:[2,4]);ctx.lineWidth=mid?1.5:1;ctx.globalAlpha=mid?.7:.22;
    ctx.beginPath();ctx.moveTo(px,a.top);ctx.lineTo(px,a.bottom);ctx.stroke()});
   ctx.restore()},
   afterDraw(c){   // 시간 선 밑에 시각 표시 (글자가 들어갈 공간이 있는 간격만, 없으면 생략)
    if(!F.time)return;const{ctx,chartArea:a,scales:{x}}=c;
    const lh=[2,4,6,12].find(h=>pxDay*h/24>=34);if(!lh)return;
    ctx.save();ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue("--mut").trim()||"#6b7385";
    ctx.font='500 11px Pretendard,"Malgun Gothic",sans-serif';ctx.textAlign="center";ctx.textBaseline="top";
    hourMarks(lo,hi,lh).forEach(t=>ctx.fillText(pad(new Date(t).getHours())+"시",x.getPixelForValue(t),a.bottom+5));
    ctx.restore()}}]});
 chartY=new Chart($("cy"),{type:"line",data:{datasets:[]},options:{...base,
  layout:{padding:{top:12,right:0,bottom:0,left:0}},
  scales:{x:{type:"linear",min:lo,max:hi,grid:{display:false},border:{display:false},ticks:{display:false},afterFit:fixX},
   y:{min:yMin,max:yMax,ticks:{stepSize:5,maxTicksLimit:100,autoSkip:false},grid:{display:false},title:{display:true,text:"온도 (°C)"},afterFit:s=>{s.width=60}}},
  plugins:{legend:{display:false},tooltip:{enabled:false}}}});
 $("lg").innerHTML=ds.map(d=>'<span><i style="border-top-color:'+d.borderColor+(d.borderDash?";border-top-style:dashed":"")+'"></i>'+d.label+'</span>').join("")+
  '<span class="hint">◀ ▶ 좌우로 스크롤해서 이동</span>';
 setTimeout(()=>{cvs.scrollLeft=cvs.scrollWidth},50);   // 가장 최근(오른쪽 끝)부터 보여줌
}
// 원본 데이터(헤더 수정본) 엑셀 내려받기: build.py가 report/download 에 만든 .xlsx 중 가장 마지막 파일
{const dl=(D.downloads||[]).slice(-1)[0],b=$("rawDl");
 if(!dl){b.disabled=true;b.title="내려받을 수정본이 없습니다"}
 else{b.title=dl.file;b.onclick=()=>{const a=document.createElement("a");a.href="download/"+encodeURIComponent(dl.file);a.download=dl.file;document.body.appendChild(a);a.click();a.remove()}}}
// 원본 데이터 보기: 처음 누를 때 raw_data.js(build.py가 만든 행 목록)를 불러와 버튼 아래에 표로 펼침. 100행씩, 시작 시각부터 오래된 순
const RAWN=100;let rawPage=0;
function renderRaw(){
 const R=window.RAW,tot=R.rows.length,pages=Math.max(1,Math.ceil(tot/RAWN));
 rawPage=Math.min(Math.max(rawPage,0),pages-1);
 const rows=R.rows.slice(rawPage*RAWN,(rawPage+1)*RAWN);
 $("rawTitle").textContent=R.file;$("rawInfo").textContent="총 "+tot.toLocaleString()+"행";
 $("rawTb").innerHTML="<tr><th>날짜"+R.cols.map(c=>"<th>"+c).join("")+"</tr>"+
  rows.map(r=>"<tr"+(r[1]?' class="hol"':"")+"><td>"+r[0]+r.slice(2).map(v=>"<td>"+(v==null?"":v.toFixed(1))).join("")+"</tr>").join("");
 $("rawPage").textContent=(rawPage+1)+" / "+pages+" 페이지";
 $("rawPrev").disabled=rawPage<=0;$("rawNext").disabled=rawPage>=pages-1;
}
{const b=$("rawView"),p=$("rawPanel");
 if(!(D.downloads||[]).length){b.disabled=true;b.title="표시할 수정본이 없습니다"}
 else b.onclick=()=>{
  if(!p.hidden){p.hidden=true;b.textContent="📄 원본 데이터 보기";b.setAttribute("aria-expanded","false");return}
  const show=()=>{p.hidden=false;b.textContent="📄 원본 데이터 접기";b.setAttribute("aria-expanded","true");renderRaw();p.scrollIntoView({behavior:"smooth",block:"nearest"})};
  if(window.RAW)return show();
  const s=document.createElement("script");s.src="raw_data.js";s.onload=show;
  s.onerror=()=>{p.hidden=false;$("rawTitle").textContent="원본 데이터를 불러오지 못했습니다";$("rawTb").innerHTML="";$("rawInfo").textContent="raw_data.js 파일을 확인하세요"};
  document.head.appendChild(s)};
 $("rawPrev").onclick=()=>{rawPage--;renderRaw()};$("rawNext").onclick=()=>{rawPage++;renderRaw()};}
$("file").onchange=load;
if(D.files.length)load();
</script></body></html>
