<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>표준 작업조건 조회 | (주)금진</title>
<style>
  :root {
    --navy-900: #0b1a3a;
    --navy-700: #1c3578;
    --navy-100: #e6ecf8;
    --bg: #f4f6fb;
    --card: #ffffff;
    --text: #1a2233;
    --muted: #5b6680;
    --line: #d7deec;
    --red: #c62828;
    --red-bg: #fdecea;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  header {
    background: linear-gradient(135deg, var(--navy-900), var(--navy-700));
    color: #fff;
    padding: 28px 16px 32px;
  }
  .wrap { max-width: 960px; margin: 0 auto; }
  header h1 { font-size: 2rem; font-weight: 800; }
  .badge {
    display: inline-flex; align-items: center; gap: 8px;
    margin-top: 10px; padding: 4px 14px;
    background: var(--red-bg); color: var(--red);
    border-radius: 999px; font-weight: 700; font-size: 0.95rem;
  }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--red); }

  main { padding: 24px 16px 60px; }
  .search { display: flex; gap: 12px; }
  .search input {
    flex: 1; min-width: 0;
    font-size: 2rem; font-weight: 700;
    padding: 14px 18px;
    border: 3px solid var(--line); border-radius: 12px;
    background: #fff; color: var(--text);
  }
  .search input:focus { outline: none; border-color: var(--navy-700); }
  .search button {
    font-size: 1.5rem; font-weight: 700;
    padding: 0 28px; border: 0; border-radius: 12px;
    background: var(--navy-700); color: #fff; cursor: pointer;
  }
  .hint { margin-top: 8px; color: var(--muted); font-size: 1rem; }

  #suggest { margin-top: 12px; }
  #suggest:empty { display: none; }
  .suggest-box {
    background: #fff; border: 3px solid var(--navy-700); border-radius: 12px;
    overflow: hidden;
  }
  .suggest-title { padding: 10px 18px; background: var(--navy-100); font-weight: 700; color: var(--navy-700); }
  .suggest-item {
    display: flex; gap: 16px; align-items: baseline; width: 100%;
    padding: 16px 18px; border: 0; border-top: 1px solid var(--line);
    background: #fff; color: var(--text); text-align: left;
    font: inherit; font-size: 1.5rem; cursor: pointer;
  }
  .suggest-item:hover, .suggest-item:focus { background: var(--navy-100); outline: none; }
  .suggest-item .s-code { font-weight: 800; min-width: 5.5em; }
  .suggest-item .s-name { flex: 1; }
  .suggest-item .s-line { color: var(--muted); font-weight: 700; }
  .suggest-empty { padding: 16px 18px; font-size: 1.3rem; color: var(--muted); }

  .lines { display: flex; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
  .line-btn {
    flex: 1; min-width: 140px;
    font: inherit; font-size: 1.5rem; font-weight: 800;
    padding: 14px 10px; border-radius: 12px; cursor: pointer;
    border: 3px solid var(--navy-700); background: #fff; color: var(--navy-700);
  }
  .line-btn .cnt { font-size: 1.05rem; font-weight: 700; margin-left: 6px; }
  .line-btn.on { background: var(--navy-700); color: #fff; }

  #lineTable { margin-top: 16px; }
  #lineTable:empty { display: none; }
  .table-wrap {
    background: #fff; border-radius: 12px; overflow-x: auto;
    box-shadow: 0 4px 14px rgba(11, 26, 58, 0.10);
  }
  .table-title { padding: 12px 18px; background: var(--navy-100); font-weight: 700; color: var(--navy-700); }
  table { width: 100%; border-collapse: collapse; font-size: 1.2rem; white-space: nowrap; }
  th, td { padding: 12px 14px; border-top: 1px solid var(--line); }
  th { background: #fafbfe; color: var(--muted); font-size: 1rem; text-align: right; }
  td { text-align: right; font-variant-numeric: tabular-nums; }
  th.l, td.l { text-align: left; }
  tbody tr { cursor: pointer; }
  tbody tr:hover, tbody tr:focus { background: var(--navy-100); outline: none; }
  tbody tr.sel { background: var(--navy-100); box-shadow: inset 4px 0 0 var(--navy-700); }
  td.code { font-weight: 800; }

  /* 결과 카드: 현장 모니터에서 2m 떨어져도 읽히는 크기 */
  .wrap-wide { max-width: 1600px; margin: 0 auto; }
  #result { margin-top: 24px; }
  .card {
    background: var(--card); border-radius: 20px;
    box-shadow: 0 8px 24px rgba(11, 26, 58, 0.12);
    padding: 36px 40px;
  }
  .card-head { border-bottom: 4px solid var(--navy-100); padding-bottom: 20px; margin-bottom: 28px; }
  .card-head .code { font-size: 2.25rem; color: var(--muted); font-weight: 800; line-height: 1.2; }
  .card-head .name { font-size: 3.5rem; font-weight: 900; line-height: 1.2; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
  .item {
    background: var(--bg); border: 3px solid var(--line); border-radius: 16px;
    padding: 22px 24px;
  }
  .item .label { font-size: 2.25rem; color: #3b4660; font-weight: 800; line-height: 1.2; }
  .item .value {
    font-size: clamp(3rem, 5.2vw, 5.25rem); font-weight: 900;
    line-height: 1.1; margin-top: 10px; font-variant-numeric: tabular-nums;
    color: var(--navy-900); white-space: nowrap;
  }
  .item .value.text { font-size: clamp(2.4rem, 4vw, 4rem); font-weight: 800; }
  .item .unit { font-size: 2rem; color: var(--muted); font-weight: 700; margin-left: 6px; }

  .notfound {
    background: var(--red-bg); color: var(--red);
    border: 3px solid var(--red); border-radius: 16px;
    padding: 28px; font-size: 2rem; font-weight: 800; text-align: center;
  }
  .notfound small { display: block; font-size: 1.1rem; font-weight: 600; margin-top: 6px; color: var(--text); }

  footer { color: var(--muted); font-size: 0.9rem; text-align: center; padding-bottom: 24px; }

  @media (max-width: 1200px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
    .item .value { font-size: clamp(2.6rem, 8vw, 5.25rem); }
    .item .value.text { font-size: clamp(2.2rem, 6.5vw, 4rem); }
  }
  @media (max-width: 720px) {
    .search input { font-size: 1.5rem; }
    .search button { font-size: 1.2rem; padding: 0 18px; }
    .card { padding: 24px 20px; }
    .card-head .code { font-size: 1.5rem; }
    .card-head .name { font-size: 2.2rem; }
    .item { padding: 14px 16px; }
    .item .label { font-size: 1.4rem; }
    .item .unit { font-size: 1.3rem; }
  }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>제품코드별 표준 작업조건</h1>
    <span class="badge"><span class="dot"></span>회사 확인 전 · 교육용 가상 데이터</span>
  </div>
</header>

<main>
  <div class="wrap">
    <form class="search" id="form" autocomplete="off">
      <input id="code" type="text" placeholder="제품코드 입력 (예: 8299-1)" autofocus aria-label="제품코드">
      <button type="submit">조회</button>
    </form>
    <p class="hint">제품코드를 입력하고 Enter를 누르세요. 앞부분만 입력하면(예: 7510) 아래에 후보가 나옵니다.</p>
    <div id="suggest"></div>
    <div class="lines" id="lines" aria-label="호기 선택"></div>
    <div id="lineTable"></div>
  </div>
  <div class="wrap-wide">
    <div id="result"></div>
  </div>
</main>

<footer>데이터 출처: data/track_c.xlsx '작업조건' 시트 (22건) · 실제 ㈜금진의 데이터가 아닙니다.</footer>

"제품코드":"9034-3","제품명":"실크 린넨 3","호기":1,"발포온도(℃)":205,"오븐온도(℃)":197,"텐션(N)":110,"코팅량(g/㎡)":110,"설정속도(m/min)":26,"엠보롤":"E-129","인쇄롤":"P-248"},{"제품코드":"9034-4","제품명":"실크 린넨 4","호기":1,"발포온도(℃)":205,"오븐온도(℃)":195,"텐션(N)":100,"코팅량(g/㎡)":140,"설정속도(m/min)":24,"엠보롤":"E-137","인쇄롤":"P-234"},{"제품코드":"5588-1","제품명":"합지 플라워 1","호기":2,"발포온도(℃)":215,"오븐온도(℃)":182,"텐션(N)":130,"코팅량(g/㎡)":120,"설정속도(m/min)":32,"엠보롤":"E-109","인쇄롤":"P-242"},{"제품코드":"5588-2","제품명":"합지 플라워 2","호기":2,"발포온도(℃)":200,"오븐온도(℃)":186,"텐션(N)":110,"코팅량(g/㎡)":180,"설정속도(m/min)":26,"엠보롤":"E-114","인쇄롤":"P-217"},{"제품코드":"5588-3","제품명":"합지 플라워 3","호기":2,"발포온도(℃)":215,"오븐온도(℃)":188,"텐션(N)":120,"코팅량(g/㎡)":150,"설정속도(m/min)":26,"엠보롤":"E-119","인쇄롤":"P-253"},{"제품코드":"5588-4","제품명":"합지 플라워 4","호기":2,"발포온도(℃)":200,"오븐온도(℃)":185,"텐션(N)":80,"코팅량(g/㎡)":120,"설정속도(m/min)":26,"엠보롤":"E-127","인쇄롤":"P-206"},{"제품코드":"8299-6","제품명":"실크 플레인 6","호기":1,"발포온도(℃)":210,"오븐온도(℃)":183,"텐션(N)":140,"코팅량(g/㎡)":110,"설정속도(m/min)":18,"엠보롤":"E-126","인쇄롤":"P-243"},{"제품코드":"7510-5","제품명":"합지 스트라이프 5","호기":3,"발포온도(℃)":200,"오븐온도(℃)":191,"텐션(N)":120,"코팅량(g/㎡)":130,"설정속도(m/min)":34,"엠보롤":"E-126","인쇄롤":"P-208"}];

// 카드에 보여줄 항목: [엑셀 컬럼명, 화면 이름, 단위]
const FIELDS = [
  ["호기", "호기", "호기"],
  ["발포온도(℃)", "발포온도", "℃"],
  ["오븐온도(℃)", "오븐온도", "℃"],
  ["텐션(N)", "텐션", "N"],
  ["코팅량(g/㎡)", "코팅량", "g/㎡"],
  ["설정속도(m/min)", "설정속도", "m/min"],
  ["엠보롤", "엠보롤", ""],
  ["인쇄롤", "인쇄롤", ""]
];

const form = document.getElementById("form");
const input = document.getElementById("code");
const result = document.getElementById("result");
const suggest = document.getElementById("suggest");

// 앞뒤 공백 제거, 가운데 공백 제거, 여러 종류의 가로줄(－, –, — 등)을 '-'로 통일
function normalize(s) {
  return s.trim().replace(/\s+/g, "").replace(/[‐-―−－]/g, "-");
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function show(code) {
  result.replaceChildren();
  if (code === "") return;

  const row = DATA.find(r => r["제품코드"] === code);

  if (!row) {
    const box = el("div", "notfound", "등록되지 않은 코드입니다");
    box.appendChild(el("small", "", "입력한 코드: " + code));
    result.appendChild(box);
    return;
  }

  const card = el("div", "card");
  const head = el("div", "card-head");
  head.appendChild(el("div", "code", row["제품코드"]));
  head.appendChild(el("div", "name", row["제품명"]));
  card.appendChild(head);

  const grid = el("div", "grid");
  for (const [key, label, unit] of FIELDS) {
    const item = el("div", "item");
    item.appendChild(el("div", "label", label));
    // 엠보롤·인쇄롤처럼 글자가 섞인 값은 조금 작게, 숫자는 가장 크고 굵게
    const value = el("div", typeof row[key] === "number" ? "value" : "value text", String(row[key]));
    if (unit) value.appendChild(el("span", "unit", unit));
    item.appendChild(value);
    grid.appendChild(item);
  }
  card.appendChild(grid);
  result.appendChild(card);
}

// 입력한 글자로 '시작하는' 제품코드만 후보로 보여줌
function showSuggest(text) {
  suggest.replaceChildren();
  if (text === "") return;

  const matches = DATA.filter(r => r["제품코드"].startsWith(text));
  const box = el("div", "suggest-box");

  if (matches.length === 0) {
    box.appendChild(el("div", "suggest-empty", "맞는 제품이 없습니다"));
    suggest.appendChild(box);
    return;
  }

  box.appendChild(el("div", "suggest-title", "후보 " + matches.length + "건 · 누르면 작업조건이 나옵니다"));
  for (const r of matches) {
    const btn = el("button", "suggest-item");
    btn.type = "button";
    btn.appendChild(el("span", "s-code", r["제품코드"]));
    btn.appendChild(el("span", "s-name", r["제품명"]));
    btn.appendChild(el("span", "s-line", r["호기"] + "호기"));
    btn.addEventListener("click", () => {
      input.value = r["제품코드"];
      suggest.replaceChildren();
      show(r["제품코드"]);
    });
    box.appendChild(btn);
  }
  suggest.appendChild(box);
}

// ── 호기 선택 버튼 + 호기별 제품 표 ──
const linesBox = document.getElementById("lines");
const lineTable = document.getElementById("lineTable");
const LINES = [1, 2, 3];
let currentLine = null;

// 표의 열: [엑셀 컬럼명, 머리글, 왼쪽정렬 여부]
const TABLE_COLS = [
  ["제품코드", "제품코드", true],
  ["제품명", "제품명", true],
  ["발포온도(℃)", "발포온도(℃)", false],
  ["오븐온도(℃)", "오븐온도(℃)", false],
  ["텐션(N)", "텐션(N)", false],
  ["코팅량(g/㎡)", "코팅량(g/㎡)", false],
  ["설정속도(m/min)", "설정속도(m/min)", false],
  ["엠보롤", "엠보롤", true],
  ["인쇄롤", "인쇄롤", true]
];

function closeLine() {
  currentLine = null;
  lineTable.replaceChildren();
  for (const b of linesBox.children) b.classList.remove("on");
}

function showLine(line) {
  const rows = DATA.filter(r => r["호기"] === line);
  const wrap = el("div", "table-wrap");
  wrap.appendChild(el("div", "table-title", line + "호기 제품 " + rows.length + "건 · 줄을 누르면 작업조건 카드가 나옵니다"));

  const table = el("table");
  const thead = el("thead");
  const htr = el("tr");
  for (const [, label, left] of TABLE_COLS) htr.appendChild(el("th", left ? "l" : "", label));
  thead.appendChild(htr);
  table.appendChild(thead);

  const tbody = el("tbody");
  for (const r of rows) {
    const tr = el("tr");
    tr.tabIndex = 0;
    for (const [key, , left] of TABLE_COLS) {
      tr.appendChild(el("td", (left ? "l" : "") + (key === "제품코드" ? " code" : ""), String(r[key])));
    }
    const pick = () => {
      for (const t of tbody.children) t.classList.remove("sel");
      tr.classList.add("sel");
      show(r["제품코드"]);
      result.scrollIntoView({ behavior: "smooth", block: "nearest" });
    };
    tr.addEventListener("click", pick);
    tr.addEventListener("keydown", e => { if (e.key === "Enter") pick(); });
    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
  wrap.appendChild(table);
  lineTable.replaceChildren(wrap);
}

for (const line of LINES) {
  const count = DATA.filter(r => r["호기"] === line).length;
  const btn = el("button", "line-btn", line + "호기");
  btn.type = "button";
  btn.appendChild(el("span", "cnt", "(" + count + "건)"));
  btn.addEventListener("click", () => {
    if (currentLine === line) { closeLine(); return; }   // 같은 버튼 다시 누르면 닫기
    closeLine();
    currentLine = line;
    btn.classList.add("on");
    input.value = "";
    suggest.replaceChildren();
    result.replaceChildren();
    showLine(line);
  });
  linesBox.appendChild(btn);
}

input.addEventListener("input", () => {
  closeLine();
  result.replaceChildren();
  showSuggest(normalize(input.value));
});

form.addEventListener("submit", e => {
  e.preventDefault();
  closeLine();
  suggest.replaceChildren();
  show(normalize(input.value));
  input.select();
});
</script>
</body>
</html>
